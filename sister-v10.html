const el=id=>document.getElementById(id);function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('此瀏覽器無法儲存紀錄，請確認不是無痕模式。')}}function show(id){['home','quiz','report','history'].forEach(k=>el(k).classList.toggle('hide',k!==id))}function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function update(){el('wrongCount').textContent='待複習錯題：'+load(wrongKey,[]).length+' 題';el('counts').textContent='目前題庫 '+bank.length+' 題，6 個單元。'}
for(const t of [...new Set(bank.map(x=>x.topic))]){let o=document.createElement('option');o.value=t;o.textContent=t;el('topic').appendChild(o)}
function start(isReplay){let topic=el('topic').value,base=bank.filter(q=>topic==='all'||q.topic===topic);let ids=load(wrongKey,[]);if(isReplay)base=base.filter(q=>ids.includes(q.id));if(!base.length){alert('這個單元目前沒有待複習錯題，先做一般練習吧！');return}let n=el('count').value;list=shuffle(base).slice(0,n==='all'?base.length:Number(n));replay=isReplay;index=0;results=[];show('quiz');render()}
function render(){let q=list[index];chosen=-1;attempt=0;firstWrong=false;locked=false;options=shuffle([q.answer,...q.wrong]);el('phase').textContent=replay?'錯題複習':'一般練習';el('progress').textContent=`第 ${index+1} / ${list.length} 題`;el('progressBar').style.width=(index/list.length*100)+'%';el('topicLabel').textContent=q.topic;el('question').textContent=q.q;el('feedback').textContent='先自己想一想，再選答案。';el('feedback').className='muted';el('choices').innerHTML='';options.forEach((o,j)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent='ABCD'[j]+'. '+o;b.onclick=()=>{if(locked)return;chosen=j;[...el('choices').children].forEach((x,k)=>x.classList.toggle('active',k===j));el('check').disabled=false};el('choices').appendChild(b)});el('check').classList.remove('hide');el('check').disabled=true;el('next').classList.add('hide')}
function checkAnswer(){if(locked||chosen<0)return;let q=list[index];attempt++;if(options[chosen]!==q.answer){firstWrong=true;if(attempt===1){el('feedback').textContent='再試一次。提示：'+q.hint;el('feedback').className='bad';chosen=-1;el('check').disabled=true;[...el('choices').children].forEach(b=>b.classList.remove('active'));return}else{el('feedback').textContent='正確答案：'+q.answer+'\n解析：'+q.explain;el('feedback').className='bad';finish(false);return}}el('feedback').textContent=(attempt===1?'答對了！':'這次答對了！')+'\n解析：'+q.explain;el('feedback').className='ok';finish(true)}
function finish(finalCorrect){locked=true;let q=list[index];results.push({id:q.id,topic:q.topic,firstCorrect:!firstWrong,finalCorrect,attempts:attempt});let wrong=load(wrongKey,[]);if(firstWrong){if(!wrong.includes(q.id))wrong.push(q.id)}else if(replay&&finalCorrect){wrong=wrong.filter(id=>id!==q.id)}save(wrongKey,wrong);[...el('choices').children].forEach(b=>b.disabled=true);el('check').classList.add('hide');el('next').classList.remove('hide');el('next').textContent=index===list.length-1?'查看學習報告':'下一題'}
function nextQuestion(){index++;if(index<list.length)render();else report()}
function report(){let correct=results.filter(x=>x.firstCorrect).length,total=results.length;let all=load(key,[]);all.push({date:new Date().toLocaleString('zh-TW'),mode:replay?'錯題複習':'一般練習',correct,total,results});save(key,all);show('report');el('stats').innerHTML=`<div class="stat">首次答對率<br><strong>${Math.round(correct/total*100)}%</strong></div><div class="stat">首次答錯<br><strong>${total-correct}</strong></div><div class="stat">待複習<br><strong>${load(wrongKey,[]).length}</strong></div>`;let wrong=results.filter(x=>!x.firstCorrect);el('summary').textContent=wrong.length?'本次建議加強：'+[...new Set(wrong.map(x=>x.topic))].join('、'):'這回合全部首次答對！';el('review').innerHTML=wrong.length?'<h3>本次錯題</h3><ul>'+wrong.map(x=>'<li>'+x.id+'｜'+x.topic+'</li>').join('')+'</ul>':'';update()}
function home(){show('home');update()}function historyView(){show('history');let a=load(key,[]);el('historyRows').innerHTML=a.length?a.slice().reverse().map(r=>`<p>${r.date}｜${r.mode}｜首次答對 ${r.correct}/${r.total}</p>`).join(''):'尚無學習紀錄。'}
function exportCSV(){let a=load(key,[]),rows=[['日期','模式','題號','單元','首次答對','最後答對','嘗試次數']];a.forEach(r=>r.results.forEach(x=>rows.push([r.date,r.mode,x.id,x.topic,x.firstCorrect?'是':'否',x.finalCorrect?'是':'否',x.attempts])));let csv='﻿'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='國一妹妹_數學學習紀錄.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}update();
</script></body></html>
